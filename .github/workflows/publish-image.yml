# Publish the MCP server image to GitHub Container Registry.
#
# Auth is the built-in GITHUB_TOKEN — no account created anywhere, no stored secret.
# ghcr.io is the one container registry the MCP registry accepts that needs nothing
# beyond permissions this repository already has.
name: Publish container image

on:
  workflow_dispatch:
  push:
    tags: ["v*.*.*"]

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # Do not ship an image whose server is broken. Same gate the other workflows use.
      - name: Gate — MCP server speaks clean JSON-RPC
        run: python3 research/test_mcp.py

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        run: |
          VERSION=$(python3 -c "import re;print(re.search(r'__version__ = \"([^\"]+)\"', open('aivis.py').read()).group(1))")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/aivis" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Most developers on this audience are on Apple Silicon; an amd64-only image
          # runs under emulation with a warning, which is a poor first impression.
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
          # The registry verifies ownership by reading this annotation off the image,
          # so it has to survive onto the manifest, not just the layer config.
          annotations: |
            io.modelcontextprotocol.server.name=io.github.krisdiallo/aivis

      # An image that does not answer JSON-RPC is worse than no image, and this is the
      # only place the real published artifact can be exercised as a user would get it.
      - name: Verify the pushed image actually serves MCP
        run: |
          IMG="${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}"
          docker pull "$IMG"
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | docker run -i --rm "$IMG" > out.jsonl
          cat out.jsonl
          python3 research/verify_image_output.py out.jsonl
